name: build-binary

on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build binaries
        env:
          RISC0_SKIP_BUILD: "1"
        run: |
          cargo build --release -p zeth-rpc-proxy --target ${{ matrix.target }}
          cargo build --release -p zeth-host --target ${{ matrix.target }}

      - name: upload zeth-rpc-proxy
        uses: actions/upload-artifact@v4
        with:
          name: zeth-rpc-proxy-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zeth-rpc-proxy

      - name: upload cli
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/cli
